[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bookstore"
version = "0.1.0"
description = "Open-source agentic commerce demo: 10k-book catalog exposed via MCP, REST, and a local-LLM chat UI (Qwen 2.5 / Ollama)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Agentic Bookstore contributors" }]
keywords = ["mcp", "agent", "commerce", "bookstore", "ollama", "qwen", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "mcp>=1.10,<2",  # 2.x replaced the low-level Server decorator API
    "faker>=22",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "ollama>=0.3",
    "sse-starlette>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
agentic-bookstore-mcp = "agentic_bookstore.mcp.server:main"
agentic-bookstore-seed = "scripts.seed_catalog:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentic_bookstore = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
